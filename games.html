<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Monkturne — Games</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23c9c1ff'/><circle cx='22' cy='14' r='11' fill='%23050610'/></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/games.css">
<link rel="stylesheet" href="src/css/notice.css">
<link rel="stylesheet" href="src/css/global.css">
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="index.html" class="brand">
            <span class="brand-dot"></span>
            <span>Monkturne</span>
        </a>
        <div class="search-wrap">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><line x1="13" y1="13" x2="10.5" y2="10.5"/></svg>
            <input type="text" id="searchBar" class="search-field" placeholder="Search games..." oninput="handleSearch(this.value)" autocomplete="off" spellcheck="false">
        </div>
        <div class="nav-actions">
            <a class="icon-btn" href="index.html" title="Home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-7 9 7v10a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2z"/></svg>
            </a>
            <a class="icon-btn" href="apps.html" title="Apps">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </a>
            <button class="icon-btn" onclick="location.reload()" title="Refresh">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            </button>
            <button class="icon-btn" onclick="openSettings()" title="Settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            </button>
        </div>
    </div>
    <div class="cat-strip" id="catStrip">
        <button class="chip active" onclick="switchView('all', event)">All Games</button>
    </div>
</nav>

<main>
<div id="modernView">
    <div class="swiper featured-slider">
        <div class="swiper-wrapper" id="heroWrapper"></div>
        <div class="swiper-pagination"></div>
        <div class="swiper-button-next"></div>
        <div class="swiper-button-prev"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <div class="section-title">Trending this week</div>
        </div>
        <div class="swiper horizontal-list" id="trendingSwiper">
            <div class="swiper-wrapper" id="trendingWrapper"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
        </div>
    </div>

    <div id="tagSections"></div>

    <div class="section">
        <div class="section-header">
            <div class="section-title clickable" onclick="toggleSection('featuredGrid', this)">
                Featured
                <svg class="collapse-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
        </div>
        <div class="grid" id="featuredGrid"></div>
    </div>

    <div class="section">
        <div class="section-header">
            <div class="section-title clickable" onclick="toggleSection('allGamesGrid', this)">
                All Games
                <svg class="collapse-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </div>
            <select id="sortOptions" class="select" onchange="sortZones()">
                <option value="name">Name</option>
                <option value="id">ID (Date)</option>
                <option value="popular">Popular</option>
            </select>
        </div>
        <div class="grid" id="allGamesGrid">
            <div id="loading" style="grid-column: 1 / -1;">
                <div class="spinner"></div>
                <div>Loading games...</div>
            </div>
        </div>
    </div>
</div>

<div id="searchView" class="hidden">
    <div class="section">
        <div class="section-header"><div class="section-title">Results</div></div>
        <div class="grid" id="searchResults"></div>
    </div>
</div>
</main>

<footer>
    <div class="footer-inner">
        <div class="footer-brand">Monkturne — a proxy for developers.</div>
        <div class="footer-links">
            <a class="footer-link" href="index.html">Home</a>
            <a class="footer-link" href="apps.html">Apps</a>
            <a class="footer-link" href="code.html">Editor</a>
            <a class="footer-link" href="privacy.html">Privacy</a>
            <a class="footer-link" href="terms.html">Terms</a>
            <a class="footer-link" onclick="saveData()">Export data</a>
            <a class="footer-link" onclick="document.getElementById('importFile').click()">Import data</a>
            <input type="file" id="importFile" style="display:none" onchange="loadData(event)">
        </div>
    </div>
</footer>

<div id="zoneViewer">
    <div class="zone-header">
        <div class="zone-title">
            <h2 id="zoneName">Game</h2>
            <button class="info-button" onclick="showZoneInfo()" title="Info">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
                </svg>
            </button>
            <span id="zoneId" style="display: none;"></span>
            <a id="zoneAuthor" href="#" target="_blank">by Author</a>
        </div>
        <div class="zone-controls">
            <button onclick="fullscreenZone()">Fullscreen</button>
            <button onclick="aboutBlank()">New tab</button>
            <button onclick="downloadZone()">Download</button>
            <button class="close-btn" onclick="closeZone()">Close</button>
        </div>
    </div>
    <iframe id="zoneFrame"></iframe>
</div>

<div id="modalOverlay" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h3 class="modal-title" id="modalTitle">Settings</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalContent"></div>
    </div>
</div>

<div id="updateToast" class="update-toast" role="status" aria-live="polite">
    <div class="ut-icon">✦</div>
    <div class="ut-body">
        <div class="ut-title">Update v1.1 released</div>
        <div class="ut-desc">Added games</div>
    </div>
    <button class="ut-close" aria-label="Dismiss">×</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="src/js/games.js" type="module"></script>
<script src="src/js/notice.js" type="module"></script>
</body>
</html>
