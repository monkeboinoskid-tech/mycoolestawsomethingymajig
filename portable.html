<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkturne Portable</title>
    <link rel="icon" href="https://ssl.gstatic.com/classroom/favicon.ico">
    <style>
        :root {
            --bg: #05060d;
            --fg: #e2e5f4;
            --accent: #c9c1ff;
            --panel: rgba(13, 14, 26, 0.85);
            --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #05060d; /* Hardcoded fallback */
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        canvas#bg {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            background: #05060d;
        }
        #app {
            display: flex; flex-direction: column;
            width: 100%; height: 100%;
            position: relative;
            z-index: 1;
        }
        .home {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2.5rem;
            padding: 20px;
            transition: opacity 0.4s var(--ease);
        }
        h1 {
            font-size: clamp(3rem, 10vw, 5rem); margin: 0;
            background: linear-gradient(to bottom, #fff, #a59dff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            font-weight: 800; letter-spacing: -0.05em;
            filter: drop-shadow(0 0 30px rgba(165, 157, 255, 0.2));
        }
        .search-box {
            width: 100%; max-width: 580px;
            background: var(--panel);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 24px;
            border-radius: 999px;
            display: flex; gap: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: transform 0.3s var(--ease), border-color 0.3s;
        }
        .search-box:focus-within {
            transform: translateY(-2px);
            border-color: rgba(201, 193, 255, 0.4);
        }
        input {
            flex: 1; background: none; border: none;
            color: white; font-size: 1.15rem; outline: none;
        }
        input::placeholder { color: rgba(255,255,255,0.3); }
        iframe {
            flex: 1; width: 100%; border: none;
            display: none; background: white;
            transition: opacity 0.5s var(--ease);
        }
        iframe.visible { display: block; }
        .toolbar {
            height: 52px; background: var(--panel);
            backdrop-filter: blur(20px);
            display: none; align-items: center; padding: 0 16px;
            gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .toolbar.visible { display: flex; }
        .btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: white; padding: 8px 16px; border-radius: 8px;
            cursor: pointer; font-weight: 500; transition: background 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        #urlInput {
            flex: 1; background: rgba(255,255,255,0.05);
            border-radius: 6px; padding: 6px 12px; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <div id="app">
        <div class="toolbar" id="toolbar">
            <button class="btn" onclick="goHome()">Home</button>
            <input type="text" id="urlInput" placeholder="Enter URL or search...">
        </div>
        <div class="home" id="home">
            <h1>Monkturne</h1>
            <div class="search-box">
                <input type="text" id="homeInput" placeholder="Search or type a URL...">
            </div>
            <p style="color: rgba(255,255,255,0.4); font-size: 0.9rem;">Standalone Portable Version</p>
        </div>
        <iframe id="frame"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/bare-mux/dist/index.js"></script>
    <script>
        // Star background logic
        const canvas = document.getElementById('bg');
        const ctx = canvas.getContext('2d');
        let w, h;
        const stars = [];
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        for(let i=0; i<200; i++) {
            stars.push({
                x: Math.random() * 1,
                y: Math.random() * 1,
                r: 0.5 + Math.random() * 1.5,
                a: 0.2 + Math.random() * 0.8,
                s: 0.001 + Math.random() * 0.004
            });
        }

        function draw() {
            ctx.fillStyle = '#05060d';
            ctx.fillRect(0, 0, w, h);
            for(const s of stars) {
                s.a += s.s;
                const alpha = (Math.sin(s.a) + 1) / 2 * 0.8;
                ctx.fillStyle = `rgba(201, 193, 255, ${alpha})`;
                ctx.beginPath();
                ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI*2);
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }
        draw();

        // Proxy Logic (Self-contained)
        const frame = document.getElementById('frame');
        const home = document.getElementById('home');
        const toolbar = document.getElementById('toolbar');
        const homeInput = document.getElementById('homeInput');
        const urlInput = document.getElementById('urlInput');

        async function launch(url) {
            if(!url.startsWith('http')) {
                if(url.includes('.') && !url.includes(' ')) url = 'https://' + url;
                else url = 'https://www.google.com/search?q=' + encodeURIComponent(url);
            }
            
            home.style.display = 'none';
            toolbar.classList.add('visible');
            frame.classList.add('visible');
            urlInput.value = url;
            
            // Note: This standalone version uses a public UltraViolet instance for convenience.
            // For production, use the full project download which has a private engine.
            frame.src = "https://txyz.xyz/main/" + btoa(url);
        }

        function goHome() {
            home.style.display = 'flex';
            toolbar.classList.remove('visible');
            frame.classList.remove('visible');
            frame.src = "about:blank";
        }

        homeInput.onkeydown = e => { if(e.key === 'Enter') launch(homeInput.value); };
        urlInput.onkeydown = e => { if(e.key === 'Enter') launch(urlInput.value); };

        // Cloak listener
        document.addEventListener('keydown', e => {
            if(e.ctrlKey && e.key === 'q') window.location.replace('https://classroom.google.com');
        });
    </script>
</body>
</html>
